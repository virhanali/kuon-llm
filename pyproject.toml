[project]
name = "kuon-llm"
version = "0.1.0"
description = "Kuon: a small English-first open-weight LLM, built from scratch (tokenizer, transformer, trainer, inference)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "regex>=2024.4.16",
    "datasets>=2.19",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuon", "kuon_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
